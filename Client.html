  $('content').querySelectorAll('[data-backup-restore]').forEach(function(button){button.addEventListener('click',async function(){button.disabled=true;try{await run(await rpc('apiStartBackup',button.dataset.backupRestore));}catch(error){toast(errorText(error));button.disabled=false;}});});
}
async function settingsPage(){var epoch=state.epoch,s=state.boot.settings,presets=await rpc('apiRetrievalPresets');if(epoch!==state.epoch)return;$('content').innerHTML=heading('settingsTitle','settingsIntro')+'<form id="settings-form" class="grid"><section class="card"><h2>'+esc(t('settings'))+'</h2>'+check('ai-compile','aiCompile','aiCompileHint',s.aiCompile)+check('ai-media','aiMedia','aiMediaHint',s.aiMedia)+field('media-vision-model','mediaVisionModel',s.mediaVisionModel,'text','mediaVisionModelHint')+field('media-audio-model','mediaAudioModel',s.mediaAudioModel,'text','mediaAudioModelHint')+check('ai-chat','aiChat','aiChatHint',s.aiChat)+check('ai-search','aiSearch','aiSearchHint',s.aiSearch)+field('embedding-model','embeddingModel',s.embeddingModel)+check('ai-rerank','aiRerank','aiRerankHint',s.aiRerank)+'<hr class="divider">'+field('api-base','apiBase',s.apiBase,'url','apiBaseHint')+field('api-model','model',s.model)+field('model-chat','stageModel.chat',(s.stageModels||{}).chat||'','text','chatDefaultModelHint')+'<details class="card"><summary>'+esc(t('stageModels'))+'</summary><p class="small">'+esc(t('stageModelsHint'))+'</p>'+['extract','synthesize','review','rerank','retrieve'].map(function(stage){return field('model-'+stage,'stageModel.'+stage,(s.stageModels||{})[stage]||'');}).join('')+'</details>'+'<div class="card"><h3>'+esc(t('apiKeysTitle'))+'</h3><p class="small">'+esc(t('apiKeysHint'))+'</p><div id="api-key-list">'+((s.apiKeys||[]).length?(s.apiKeys||[]).map(function(k){return '<div class="row"><span>'+esc(t('apiKeyNumber',{number:k.position}))+(k.active?' · '+esc(t('apiKeyActive')):'')+'</span><button type="button" class="btn" data-remove-api-key="'+esc(k.id)+'">'+esc(t('apiKeyRemove'))+'</button></div>';}).join(''):'<p class="small">'+esc(t('keyMissing'))+'</p>')+'</div>'+field('new-api-key','apiKey','','password','apiKeyHint')+btn('add-api-key','apiKeyAdd')+'</div>'+notice(t('privacyNote'))+'<label class="field">'+esc(t('connectionTestStage'))+'<select id="connection-test-stage">'+['default','extract','synthesize','chat','review','rerank','retrieve','embedding'].map(function(stage){return '<option value="'+stage+'">'+esc(t(stage==='default'?'defaultModel':stage==='embedding'?'embeddingModel':'stageModel.'+stage))+'</option>';}).join('')+'</select></label>'+btn('connection-test','testConnection')+'<p class="small">'+esc(t('connectionTestHint'))+'</p><div id="connection-test-result" role="status"></div></section><section class="card">'+field('top-k','topK',s.topK,'number')+field('bm25-k1','bm25K1',s.bm25K1,'number')+field('bm25-b','bm25B',s.bm25B,'number')+field('rrf-k','rrfK',s.rrfK,'number')+field('candidate-k','candidateK',s.candidateK,'number')+check('auto-resume','autoResume','autoResumeHint',s.autoResume)+check('convert-legacy','convertLegacy','convertLegacyHint',s.convertLegacy)+'<hr class="divider"><button type="submit" id="save-settings" class="btn primary">'+esc(t('save'))+'</button></section></form>'+presetSettingsHtml(presets);bindPresetSettings(presets);bind('add-api-key',async function(){var key=$('new-api-key').value;state.boot.settings=await rpc('apiAddApiKey',{key:key});$('new-api-key').value='';toast(t('apiKeyAdded'));await settingsPage();});$('api-key-list').querySelectorAll('[data-remove-api-key]').forEach(function(button){button.addEventListener('click',async function(){try{state.boot.settings=await rpc('apiRemoveApiKey',button.dataset.removeApiKey);toast(t('apiKeyRemoved'));await settingsPage();}catch(error){toast(errorText(error));}});});bind('connection-test',async function(){var button=$('connection-test');button.disabled=true;try{var result=await rpc('apiTestConnection',{stage:$('connection-test-stage').value});if(epoch===state.epoch)$('connection-test-result').innerHTML=notice(t('connectionTestPassed')+' · '+result.model+' · '+result.elapsedMs+' ms');}finally{if(button.isConnected)button.disabled=false;}});[['bm25-k1',0,5,'0.1'],['bm25-b',0,1,'0.05'],['rrf-k',0,200,'1'],['candidate-k',1,20,'1']].forEach(function(x){$(x[0]).min=String(x[1]);$(x[0]).max=String(x[2]);$(x[0]).step=x[3];});$('top-k').min='1';$('top-k').max='10';$('settings-form').addEventListener('submit',async function(e){e.preventDefault();$('save-settings').disabled=true;try{state.boot.settings=await rpc('apiSaveSettings',{aiCompile:$('ai-compile').checked,aiMedia:$('ai-media').checked,mediaVisionModel:$('media-vision-model').value,mediaAudioModel:$('media-audio-model').value,aiChat:$('ai-chat').checked,aiSearch:$('ai-search').checked,aiRerank:$('ai-rerank').checked,embeddingModel:$('embedding-model').value,apiBase:$('api-base').value,model:$('api-model').value,stageModels:Object.fromEntries(['extract','synthesize','chat','review','rerank','retrieve'].map(function(stage){return [stage,$('model-'+stage).value];})),topK:Number($('top-k').value),bm25K1:Number($('bm25-k1').value),bm25B:Number($('bm25-b').value),rrfK:Number($('rrf-k').value),candidateK:Number($('candidate-k').value),autoResume:$('auto-resume').checked,convertLegacy:$('convert-legacy').checked,language:state.language});shell();toast(t('saved'));if(state.route==='settings')await settingsPage();}catch(error){toast(errorText(error));}finally{if($('save-settings'))$('save-settings').disabled=false;}});}
function presetSettingsHtml(presets){return '<section class="card"><h2>'+esc(t('retrievalPresets'))+'</h2><p>'+esc(t('retrievalPresetsHint'))+'</p>'+field('preset-name','presetName','','text')+btn('preset-save','saveRetrievalPreset')+presets.map(function(p,i){return '<p><strong>'+esc(p.name)+'</strong> · '+esc(date(p.at))+' <button class="btn" data-preset-apply="'+i+'">'+esc(t('applyPreset'))+'</button><button class="btn" data-preset-remove="'+i+'">'+esc(t('removePreset'))+'</button></p>';}).join('')+'</section>';}

async function render(){
  var parts=location.hash.replace(/^#/,'').split('/');state.route=routes.includes(parts[0])?parts[0]:'dashboard';var epoch=++state.epoch;shell();
  if(!state.boot||!state.boot.ready){await setup();return;}
  $('content').innerHTML='<div class="loading"><span class="spinner" aria-hidden="true"></span><p>'+esc(t('loading'))+'</p></div>';
  try{var handlers={dashboard:dashboard,pipeline:pipelinePage,sources:sourcePage,emails:emailsPage,connectors:connectorsPage,pages:function(){return wikiPage(parts[1]?decodeURIComponent(parts[1]):null);},search:searchPage,chat:chatPage,graph:graphPage,health:healthPage,analytics:analyticsPage,research:researchPage,history:historyPage,backups:backupsPage,settings:settingsPage};await handlers[state.route]();}
  catch(error){if(epoch===state.epoch)$('content').innerHTML=notice(errorText(error),true)+btn('retry-view','retry');bind('retry-view',render);}
}
document.querySelectorAll('[data-language]').forEach(function(button){button.addEventListener('click',function(){state.language=button.dataset.language;saveLanguage(state.language);render();});});
bind('theme-toggle',function(){state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;try{localStorage.setItem('wb-theme',state.theme);}catch(_){}shell();});
bind('nav-toggle',function(){setSidebarOpen(!document.body.classList.contains('nav-open'));});bind('nav-scrim',function(){setSidebarOpen(false);});
document.addEventListener('keydown',function(event){if(!document.body.classList.contains('nav-open'))return;if(event.key==='Escape'){setSidebarOpen(false);$('nav-toggle').focus();}if(event.key==='Tab'){var focusable=Array.from($('navigation-sidebar').querySelectorAll('a,summary,button')).filter(function(el){return el.getClientRects().length;});var first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
window.addEventListener('resize',function(){setSidebarOpen(false);});
setSidebarOpen(false);
// Internal routes must stay in this frame instead of opening userCodeAppPanel at the top level.
document.addEventListener('click',function(event){
  var anchor=event.target.closest&&event.target.closest('a[href^="#"]');
  if(!anchor||event.defaultPrevented||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
  var hash=anchor.getAttribute('href');if(!routes.includes(hash.slice(1).split('/')[0]))return;
  event.preventDefault();setSidebarOpen(false);
  if(location.hash===hash)render();else location.hash=hash;
},true);
window.addEventListener('hashchange',render);
(async function(){shell();$('content').innerHTML='<div class="loading">'+esc(t('loading'))+'</div>';try{await refreshBoot();await render();if(state.boot.job&&state.boot.job.status==='running')advanceBuild();}catch(error){$('content').innerHTML=notice(errorText(error),true)+btn('bootstrap-retry','retry');bind('bootstrap-retry',function(){location.reload();});}})();
}());
