<script>
(function () {
'use strict';
function storedLanguage(){try{return localStorage.getItem('wb-language');}catch(_){return null;}}
function saveLanguage(value){try{localStorage.setItem('wb-language',value);}catch(_){}}
var state = { boot: null, language: storedLanguage() || (/^de/i.test(navigator.language) ? 'de' : 'en'), route: 'dashboard', pages: [], chat: null, advancing: false, epoch: 0 };
var routes = ['dashboard','sources','pages','search','chat','graph','health','history','settings'];
var symbols = ['⌂','▤','▦','⌕','○','⋈','✓','↺','⚙'];
var $ = function (id) { return document.getElementById(id); };
function t(key, vars) {
  var value = (WB_TRANSLATIONS[state.language] || WB_TRANSLATIONS.en)[key] || WB_TRANSLATIONS.en[key] || key;
  Object.keys(vars || {}).forEach(function (name) { value = value.replaceAll('{' + name + '}', String(vars[name])); });
  return value;
}
function esc(text) { return String(text == null ? '' : text).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function safeUrl(value) { try { var url = new URL(String(value)); return url.protocol === 'https:' ? url.href : '#'; } catch (_) { return '#'; } }
function link(url, label, cls) { return '<a class="' + (cls || '') + '" href="' + esc(safeUrl(url)) + '" target="_blank" rel="noopener noreferrer">' + esc(label) + '</a>'; }
function pageLink(slug, title) { return '<a href="#pages/' + encodeURIComponent(slug) + '">' + esc(title) + '</a>'; }
function date(value) { return value ? new Intl.DateTimeFormat(state.language, { dateStyle:'medium', timeStyle:'short' }).format(new Date(value)) : '—'; }
function btn(id, key, primary) { return '<button type="button" id="' + id + '" class="btn' + (primary ? ' primary' : '') + '">' + esc(t(key)) + '</button>'; }
function heading(title, intro, actions) { return '<div class="page-heading"><div><h1>' + esc(t(title)) + '</h1><p class="lead">' + esc(t(intro)) + '</p></div><div class="actions">' + (actions || '') + '</div></div>'; }
function empty(title, intro) { return '<div class="empty"><h2>' + esc(t(title)) + '</h2>' + (intro ? '<p>' + esc(t(intro)) + '</p>' : '') + '</div>'; }
function notice(text, error) { return '<div class="notice' + (error ? ' error' : '') + '">' + esc(text) + '</div>'; }
function toast(text) { $('toast').textContent = text; $('toast').hidden = false; clearTimeout(toast.timer); toast.timer = setTimeout(function () { $('toast').hidden = true; }, 5500); }
function rpc(name) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    if (typeof google === 'undefined' || !google.script) { reject(new Error('OPERATION_FAILED')); return; }
    var runner = google.script.run.withSuccessHandler(function (reply) {
      if (!reply || !reply.ok) reject(new Error(reply && reply.error || 'OPERATION_FAILED'));
      else resolve(reply.data);
    }).withFailureHandler(function () { reject(new Error('OPERATION_FAILED')); });
    runner[name].apply(runner, args);
  });
}
function errorText(error) { return t('error.' + error.message) === 'error.' + error.message ? t('error.OPERATION_FAILED') : t('error.' + error.message); }
function bind(id, action) { var element = $(id); if (element) element.addEventListener('click', function (event) { Promise.resolve().then(function () { return action(event); }).catch(function (error) { toast(errorText(error)); }); }); }
function field(id, label, value, type, hint) { return '<label class="field">' + esc(t(label)) + '<input id="' + id + '" type="' + (type || 'text') + '" value="' + esc(value) + '"' + (type === 'password' ? ' autocomplete="new-password"' : '') + '>' + (hint ? '<small>' + esc(t(hint)) + '</small>' : '') + '</label>'; }
function check(id, label, hint, checked) { return '<label class="check"><input type="checkbox" id="' + id + '"' + (checked ? ' checked' : '') + '><span>' + esc(t(label)) + '<small>' + esc(t(hint)) + '</small></span></label>'; }
function shell() {
  document.documentElement.lang = state.language;
  document.querySelectorAll('[data-t]').forEach(function (node) { node.textContent = t(node.dataset.t); });
  document.querySelectorAll('[data-t-aria]').forEach(function (node) { node.setAttribute('aria-label', t(node.dataset.tAria)); });
  document.querySelectorAll('[data-language]').forEach(function (button) { button.classList.toggle('active', button.dataset.language === state.language); });
  $('navigation').innerHTML = routes.map(function (route, i) { return '<a href="#' + route + '" class="' + (route === state.route ? 'active' : '') + '"><span class="nav-icon" aria-hidden="true">' + symbols[i] + '</span>' + esc(t(route)) + '</a>'; }).join('');
  $('breadcrumb').textContent = 'Wissensbau / ' + t(state.route);
  var settings = state.boot && state.boot.settings;
  $('mode-badge').textContent = t(settings && (settings.aiCompile || settings.aiChat) ? 'aiMode' : 'localMode');
  $('mode-badge').classList.toggle('ai', Boolean(settings && (settings.aiCompile || settings.aiChat)));
  if (state.boot && state.boot.ready) { $('workspace-link').href = safeUrl(state.boot.workspace.url); $('workspace-link').hidden = false; }
}
function buildBanner(job) {
  var banner = $('build-banner');
  banner.hidden = !job || job.status !== 'running';
  if (banner.hidden) return;
  banner.innerHTML = '<strong>' + esc(t('phase.' + job.phase)) + '</strong><progress value="' + job.cursor + '" max="' + Math.max(1, job.total) + '"></progress><span>' + job.cursor + ' / ' + job.total + '</span>' + btn('banner-continue', 'continueBuild') + btn('banner-cancel', 'cancelBuild');
  bind('banner-continue', advanceBuild); bind('banner-cancel', cancelBuild);
}
async function refreshBoot() { state.boot = await rpc('apiBootstrap'); shell(); buildBanner(state.boot.job); }
async function setup() {
  $('content').innerHTML = '<section class="setup card"><span class="brand-mark">W</span><h1>' + esc(t('setupTitle')) + '</h1><p class="lead">' + esc(t('setupIntro')) + '</p><hr class="divider">' + field('setup-parent', 'setupParent', '', 'text', 'setupParentHint') + btn('setup-create', 'setupButton', true) + notice(t('setupNote')) + '</section>';
  bind('setup-create', async function () { $('setup-create').disabled = true; try { await rpc('apiSetup', $('setup-parent').value); await refreshBoot(); await render(); } finally { if ($('setup-create')) $('setup-create').disabled = false; } });
}
async function startBuild(force) { state.boot.job = await rpc('apiStartBuild', Boolean(force)); buildBanner(state.boot.job); advanceBuild(); }
async function cancelBuild() { state.boot.job = await rpc('apiCancelBuild'); buildBanner(state.boot.job); toast(t(state.boot.job && state.boot.job.cancelRequested ? 'cancelRequested' : 'status.stopped')); }
async function advanceBuild() {
  if (state.advancing) return;
  state.advancing = true;
  try {
    var job = await rpc('apiContinueBuild'); state.boot.job = job; buildBanner(job);
    if (job && job.status === 'running') setTimeout(advanceBuild, 1500);
    else { await refreshBoot(); if (['dashboard','history','pages','health'].indexOf(state.route) >= 0) await render(); }
  } catch (error) { toast(errorText(error)); }
  finally { state.advancing = false; }
}
async function dashboard() {
  var b = state.boot, c = b.counts, job = b.job;
  $('content').innerHTML = '<div class="eyebrow">' + esc(t('overviewEyebrow')) + '</div>' + heading('overviewTitle','overviewIntro',btn('overview-build','buildButton',true)) +
    '<div class="metrics">' + [['originalFiles',c.sources],['linkedPages',c.pages],['entities',c.entities],['activeVersion',b.version ? date(b.version.slice(0,4)+'-'+b.version.slice(4,6)+'-'+b.version.slice(6,8)+'T'+b.version.slice(8,10)+':'+b.version.slice(10,12)+':'+b.version.slice(12,14)+'Z') : t('notBuilt')]].map(function (m) { return '<div class="metric"><span>' + esc(t(m[0])) + '</span><strong' + (m[0] === 'activeVersion' ? ' style="font-size:15px;margin-top:16px"' : '') + '>' + esc(m[1]) + '</strong></div>'; }).join('') + '</div>' +
    '<div class="grid"><section class="card"><h2>' + esc(t('buildTitle')) + '</h2><p class="small">' + esc(t('buildIntro')) + '</p>' + [1,2,3].map(function (n) { return '<div class="step"><span class="step-number">0'+n+'</span><div><h3>' + esc(t('step'+n)) + '</h3><p>' + esc(t('step'+n+'Hint')) + '</p></div></div>'; }).join('') + '</section><section class="card accent"><h2>' + esc(t('approachTitle')) + '</h2><p class="lead">' + esc(t('approachIntro')) + '</p><a href="#sources" class="btn">' + esc(t('quickStart')) + '</a>' + notice(t(b.settings.aiCompile ? 'aiWarning' : 'localWarning')) + '</section></div>' +
    (job ? '<section class="card"><div class="row"><h2>' + esc(t('status.'+job.status)) + '</h2><a href="#history" class="text-link">'+esc(t('history'))+'</a></div><p class="small">'+esc(date(job.startedAt))+' · '+esc(t('phase.'+job.phase))+'</p>'+failureList(job.failures)+'</section>' : '');
  bind('overview-build', function () { return startBuild(false); });
}
function failureList(items) { return (items || []).map(function (item) { return notice((item.source ? item.source + ': ' : '') + t('error.' + item.code), true); }).join(''); }
async function sourcePage() {
  var epoch = state.epoch, data = await rpc('apiSources'); if (epoch !== state.epoch) return;
  $('content').innerHTML = heading('sourcesTitle','sourcesIntro',link(data.inboxUrl,t('openInbox'),'btn')) + '<div class="grid"><section class="card"><h2>'+esc(t('uploadTitle'))+'</h2><div class="dropzone"><p class="small">'+esc(t('uploadHint'))+'</p><label for="upload-files" class="small">'+esc(t('chooseFiles'))+'</label><input id="upload-files" type="file" multiple></div><div class="toolbar">'+btn('upload-button','uploadButton',true)+'</div></section><section class="card"><h2>'+esc(t('importTitle'))+'</h2><p class="small">'+esc(t('importHint'))+'</p>'+field('drive-file','driveLink','','text')+btn('import-button','importButton')+'</section></div><details class="card"><summary>'+esc(t('acceptedFormats'))+'</summary><p class="small" style="margin-top:12px">'+esc(t('formatDetails'))+'</p></details><div class="toolbar"><input id="source-filter" aria-label="'+esc(t('sourceFilter'))+'" placeholder="'+esc(t('sourceFilter'))+'">'+btn('source-refresh','refresh')+btn('source-build','buildButton',true)+'</div><div id="source-table"></div>';
  function draw(filter) { var files = data.sources.filter(function (s) { return s.path.toLocaleLowerCase().includes(filter || ''); }); $('source-table').innerHTML = files.length ? '<div class="table-wrap"><table><thead><tr>'+['file','format','modified','size'].map(function (k) { return '<th>'+esc(t(k))+'</th>'; }).join('')+'</tr></thead><tbody>'+files.map(function (s) { return '<tr><td class="file-title">'+link(s.url,s.title)+'<small>'+esc(s.path)+'</small></td><td>'+esc(s.mime.replace('application/vnd.google-apps.','Google '))+'</td><td>'+esc(date(s.modified))+'</td><td>'+esc(s.size ? (s.size/1024).toFixed(1)+' KB' : '—')+'</td></tr>'; }).join('')+'</tbody></table></div>' : empty('noSources','noSourcesHint'); }
  draw(''); $('source-filter').addEventListener('input',function(e){ draw(e.target.value.toLocaleLowerCase()); });
  bind('source-refresh',sourcePage); bind('source-build',function(){return startBuild(false);});
  bind('import-button',async function(){ $('import-button').disabled=true; try { await rpc('apiImportDrive',$('drive-file').value); toast(t('uploaded')); if(state.route==='sources')await sourcePage(); } finally {if($('import-button')) $('import-button').disabled=false;} });
  bind('upload-button',async function(){
    var files=Array.from($('upload-files').files); if(!files.length)return;
    $('upload-button').disabled=true;
    try { for(var file of files){ if(file.size>10*1024*1024)throw new Error('UPLOAD_LIMIT'); var base64=await new Promise(function(resolve,reject){var reader=new FileReader();reader.onload=function(){resolve(String(reader.result).split(',')[1]);};reader.onerror=function(){reject(new Error('OPERATION_FAILED'));};reader.readAsDataURL(file);}); await rpc('apiUpload',{name:file.name,mime:file.type,base64:base64}); } toast(t('uploaded'));if(state.route==='sources')await sourcePage(); }
    finally{if($('upload-button'))$('upload-button').disabled=false;}
  });
}
function inline(raw) {
  var re=/\[([^\]\n]+)\]\(([^)\s]+)\)|\*\*([^*\n]+)\*\*|`([^`\n]+)`/g, out='', last=0, m;
  while((m=re.exec(raw))){out+=esc(raw.slice(last,m.index));if(m[1]){var internal=m[2].match(/^\.\/([^/]+)\.md$/);out+=internal?pageLink(internal[1],m[1]):link(m[2],m[1]);}else if(m[3])out+='<strong>'+esc(m[3])+'</strong>';else out+='<code>'+esc(m[4])+'</code>';last=re.lastIndex;}return out+esc(raw.slice(last));
}
function markdown(raw) {
  raw=String(raw).replace(/^---\n[\s\S]*?\n---\n/,'').replace(/<!--[^]*?-->/g,'');
  var out=[],code=false,buffer=[],list=false;
  function closeList(){if(list){out.push('</ul>');list=false;}}
  raw.split('\n').forEach(function(line){
    if(/^```/.test(line)){closeList();if(code){out.push('<pre><code>'+esc(buffer.join('\n'))+'</code></pre>');buffer=[];}code=!code;return;}
    if(code){buffer.push(line);return;}
    var h=line.match(/^(#{1,6})\s+(.*)$/);if(h){closeList();var level=Math.min(h[1].length,3);out.push('<h'+level+'>'+inline(h[2])+'</h'+level+'>');return;}
    var li=line.match(/^\s*[-*]\s+(.*)$/);if(li){if(!list){out.push('<ul>');list=true;}out.push('<li>'+inline(li[1])+'</li>');return;}
    closeList();if(line.trim())out.push('<p>'+inline(line)+'</p>');
  });closeList();if(code)out.push('<pre><code>'+esc(buffer.join('\n'))+'</code></pre>');return out.join('');
}
async function wikiPage(slug) {
  var epoch=state.epoch, data=await rpc('apiPages');if(epoch!==state.epoch)return;state.pages=data.pages;
  $('content').innerHTML=heading('pagesTitle','pagesIntro',btn('pages-export','export'))+'<div class="pages-layout"><aside class="card"><input id="page-filter" aria-label="'+esc(t('pageFilter'))+'" placeholder="'+esc(t('pageFilter'))+'"><div id="page-list" class="page-list"></div></aside><article id="page-body" class="card">'+empty(data.pages.length?'choosePage':'noPages',data.pages.length?null:'noPagesHint')+'</article></div>';
  function draw(filter){$('page-list').innerHTML=data.pages.filter(function(p){return p.title.toLocaleLowerCase().includes(filter||'');}).map(function(p){return '<button type="button" data-page="'+esc(p.slug)+'" class="'+(p.slug===slug?'active':'')+'">'+esc(p.title)+'</button>';}).join('');$('page-list').querySelectorAll('[data-page]').forEach(function(button){button.addEventListener('click',function(){location.hash='pages/'+encodeURIComponent(button.dataset.page);});});}
  draw('');$('page-filter').addEventListener('input',function(e){draw(e.target.value.toLocaleLowerCase());});bind('pages-export',exportWiki);
  if(slug){var page=await rpc('apiPage',slug);if(epoch!==state.epoch)return;$('page-body').innerHTML='<div class="row"><span class="badge'+(page.generated?' ai':'')+'">'+esc(t(page.generated?'generatedPage':'sourcePage'))+'</span>'+link(page.url,t('openMarkdown'),'text-link')+'</div>'+(page.generated?notice(t('aiWarning')):'')+'<div class="prose">'+markdown(page.markdown)+'</div>';}
}
async function exportWiki(){var data=await rpc('apiExport');toast(t('exportReady'));var box=document.createElement('div');box.className='notice';box.innerHTML=link(data.url,data.name);$('content').prepend(box);}
function scopeSelect(id){return '<label class="small" for="'+id+'">'+esc(t('scope'))+'</label><select id="'+id+'"><option value="raw">'+esc(t('rawScope'))+'</option><option value="wiki">'+esc(t('wikiScope'))+'</option></select>';}
function resultHtml(hit){return '<article class="result"><div class="result-header"><strong>'+link(hit.url,hit.title)+'</strong><span class="small">'+esc(t('match'))+' '+hit.number+'</span></div><div class="quote">'+esc(hit.text)+'</div>'+(hit.slug?'<div class="small">'+pageLink(hit.slug,t('pages'))+'</div>':'')+'</article>';}
async function searchPage(){
  $('content').innerHTML=heading('searchTitle','searchIntro')+'<form id="search-form" class="card"><div class="toolbar"><input id="search-query" required maxlength="1000" aria-label="'+esc(t('query'))+'" placeholder="'+esc(t('query'))+'"><button class="btn primary" type="submit">'+esc(t('searchButton'))+'</button></div><div class="toolbar">'+scopeSelect('search-scope')+'</div><p class="small">'+esc(t('lastBuild'))+'</p></form><div id="search-results"></div>';
  $('search-form').addEventListener('submit',async function(e){e.preventDefault();$('search-results').innerHTML='<div class="loading">'+esc(t('loading'))+'</div>';try{var result=await rpc('apiSearch',{query:$('search-query').value,scope:$('search-scope').value});if(state.route!=='search'||!$('search-results'))return;$('search-results').innerHTML=result.hits.length?result.hits.map(resultHtml).join(''):empty('noMatches','noMatchesHint');}catch(error){if($('search-results'))$('search-results').innerHTML=notice(errorText(error),true);}});
}
async function chatPage(){
  var epoch=state.epoch, chats=await rpc('apiChats');if(epoch!==state.epoch)return;
  $('content').innerHTML=heading('chatTitle','chatIntro',btn('new-chat','newChat'))+'<div class="chat-layout"><aside class="card chat-history" id="chat-list">'+(chats.length?chats.map(function(c){return '<button type="button" data-chat="'+esc(c.id)+'" class="'+(state.chat&&state.chat.id===c.id?'active':'')+'">'+esc(c.title)+'</button>';}).join(''):'<p class="small">'+esc(t('noChats'))+'</p>')+'</aside><section class="card"><div class="messages" id="messages"></div><form id="ask-form"><hr class="divider"><div class="toolbar">'+scopeSelect('chat-scope')+'</div><label class="field" for="chat-question">'+esc(t('question'))+'</label><textarea id="chat-question" required maxlength="1000" placeholder="'+esc(t('question'))+'"></textarea><div class="toolbar"><button id="ask-button" class="btn primary" type="submit">'+esc(t('ask'))+'</button><span id="ask-status" class="small"></span></div></form></section></div>';
  function draw(){var messages=state.chat?state.chat.messages:[];$('messages').innerHTML=messages.length?messages.map(function(m){return '<div class="message '+(m.role==='user'?'user':'')+'"><div class="message-label">'+esc(t(m.role==='user'?'you':m.mode==='generated'?'generatedAnswer':'sourceExcerpts'))+'</div><div class="message-content">'+esc(m.mode==='no_match'?t('noMatches'):m.content)+'</div>'+(m.sources&&m.sources.length?'<div class="source-links">'+m.sources.map(function(s){return link(s.url,'['+s.number+'] '+s.title);}).join('')+'</div>':'')+'</div>';}).join(''):empty('chatEmpty');$('messages').scrollTop=$('messages').scrollHeight;}
  draw();bind('new-chat',function(){state.chat=null;return chatPage();});$('chat-list').querySelectorAll('[data-chat]').forEach(function(button){button.addEventListener('click',async function(){try{state.chat=await rpc('apiChat',button.dataset.chat);if(state.route==='chat')await chatPage();}catch(error){toast(errorText(error));}});});
  $('ask-form').addEventListener('submit',async function(e){e.preventDefault();var query=$('chat-question').value.trim();if(!query)return;$('ask-button').disabled=true;$('ask-status').textContent=t('sending');try{state.chat=await rpc('apiAsk',{message:query,scope:$('chat-scope').value,chatId:state.chat&&state.chat.id});if(epoch===state.epoch){$('chat-question').value='';draw();}}catch(error){toast(errorText(error));}finally{if($('ask-button'))$('ask-button').disabled=false;if($('ask-status'))$('ask-status').textContent='';}});
}
async function graphPage(){var epoch=state.epoch,data=await rpc('apiGraph'),byId={};if(epoch!==state.epoch)return;data.nodes.forEach(function(n){byId[n.id]=n;});$('content').innerHTML=heading('graphTitle','graphIntro')+'<div class="relations">'+data.nodes.map(function(n){var links=data.links.filter(function(l){return l.from===n.id;});return '<article class="relation-card"><h3>'+pageLink(n.id,n.title)+'</h3><small>'+esc(t('outgoing'))+'</small>'+(links.length?links.map(function(l){return pageLink(l.to,byId[l.to]?byId[l.to].title:l.to);}).join(''):'<p class="small">'+esc(t('noConnections'))+'</p>')+'</article>';}).join('')+'</div><section class="card" style="margin-top:25px"><h2>'+esc(t('exactEntities'))+'</h2><p class="small">'+esc(t('entityHint'))+'</p>'+data.entities.map(function(entity){return '<span class="badge" style="margin:4px">'+esc(entity.name)+' · '+entity.sources.length+'</span>';}).join('')+'</section>';}
async function healthPage(){var epoch=state.epoch,data=await rpc('apiHealth');if(epoch!==state.epoch)return;$('content').innerHTML=heading('healthTitle','healthIntro')+'<div class="metrics">'+[['pages',data.pages],['isolated',data.isolated.length],['broken',data.broken.length],['warnings',data.warnings.length]].map(function(m){return '<div class="metric"><span>'+esc(t(m[0]))+'</span><strong>'+m[1]+'</strong></div>';}).join('')+'</div><div class="grid"><section class="card"><h2>'+esc(t('isolated'))+'</h2>'+(data.isolated.map(function(p){return '<p>'+pageLink(p.slug,p.title)+'</p>';}).join('')||'<p class="small">'+esc(t('healthy'))+'</p>')+'<h2>'+esc(t('broken'))+'</h2>'+(data.broken.map(function(l){return '<p>'+pageLink(l.from,l.from)+' → '+esc(l.to)+'</p>';}).join('')||'<p class="small">'+esc(t('healthy'))+'</p>')+'</section><section class="card"><h2>'+esc(t('warnings'))+'</h2>'+(data.warnings.map(function(w){return '<div class="notice"><strong>'+esc(w.source)+'</strong><br>'+esc(t('warning.'+w.code))+'</div>';}).join('')||'<p class="small">'+esc(t('warningEmpty'))+'</p>')+'</section></div>';}
async function historyPage(){var epoch=state.epoch,jobs=await rpc('apiHistory');if(epoch!==state.epoch)return;$('content').innerHTML=heading('historyTitle','historyIntro',btn('history-refresh','refresh')+btn('history-rebuild','rebuildButton'))+(jobs.length?jobs.map(function(job){return '<section class="card"><div class="row"><h2>'+esc(t('status.'+job.status))+'</h2><span class="small">'+esc(date(job.startedAt))+'</span></div><div class="toolbar small"><span>'+esc(t('phase.'+job.phase))+'</span><span>'+job.cursor+' / '+job.total+'</span><span>'+esc(t('modelCalls'))+': '+job.calls+'</span><span>'+esc(t('cacheHits'))+': '+job.cacheHits+'</span></div>'+failureList(job.failures)+(job.warnings||[]).map(function(w){return '<p class="small">'+esc(w.source)+': '+esc(t('warning.'+w.code))+'</p>';}).join('')+'</section>';}).join(''):empty('noHistory'));bind('history-refresh',historyPage);bind('history-rebuild',function(){return startBuild(true);});}
async function settingsPage(){var s=state.boot.settings;$('content').innerHTML=heading('settingsTitle','settingsIntro')+'<form id="settings-form" class="grid"><section class="card"><h2>'+esc(t('settings'))+'</h2>'+check('ai-compile','aiCompile','aiCompileHint',s.aiCompile)+check('ai-chat','aiChat','aiChatHint',s.aiChat)+'<hr class="divider">'+field('api-base','apiBase',s.apiBase,'url','apiBaseHint')+field('api-model','model',s.model)+field('api-key','apiKey','','password','apiKeyHint')+'<p class="small">'+esc(t(s.hasApiKey?'keySaved':'keyMissing'))+'</p><label class="check"><input id="clear-key" type="checkbox"><span>'+esc(t('clearKey'))+'</span></label>'+notice(t('privacyNote'))+'</section><section class="card">'+field('top-k','topK',s.topK,'number')+check('auto-resume','autoResume','autoResumeHint',s.autoResume)+check('convert-legacy','convertLegacy','convertLegacyHint',s.convertLegacy)+'<hr class="divider"><button type="submit" id="save-settings" class="btn primary">'+esc(t('save'))+'</button></section></form>';$('top-k').min='1';$('top-k').max='10';$('settings-form').addEventListener('submit',async function(e){e.preventDefault();$('save-settings').disabled=true;try{state.boot.settings=await rpc('apiSaveSettings',{aiCompile:$('ai-compile').checked,aiChat:$('ai-chat').checked,apiBase:$('api-base').value,model:$('api-model').value,apiKey:$('api-key').value,clearApiKey:$('clear-key').checked,topK:Number($('top-k').value),autoResume:$('auto-resume').checked,convertLegacy:$('convert-legacy').checked,language:state.language});shell();toast(t('saved'));if(state.route==='settings')await settingsPage();}catch(error){toast(errorText(error));}finally{if($('save-settings'))$('save-settings').disabled=false;}});}
async function render(){
  var parts=location.hash.replace(/^#/,'').split('/');state.route=routes.includes(parts[0])?parts[0]:'dashboard';var epoch=++state.epoch;shell();
  if(!state.boot||!state.boot.ready){await setup();return;}
  $('content').innerHTML='<div class="loading"><span class="spinner" aria-hidden="true"></span><p>'+esc(t('loading'))+'</p></div>';
  try{var handlers={dashboard:dashboard,sources:sourcePage,pages:function(){return wikiPage(parts[1]?decodeURIComponent(parts[1]):null);},search:searchPage,chat:chatPage,graph:graphPage,health:healthPage,history:historyPage,settings:settingsPage};await handlers[state.route]();}
  catch(error){if(epoch===state.epoch)$('content').innerHTML=notice(errorText(error),true)+btn('retry-view','retry');bind('retry-view',render);}
}
document.querySelectorAll('[data-language]').forEach(function(button){button.addEventListener('click',function(){state.language=button.dataset.language;saveLanguage(state.language);render();});});
window.addEventListener('hashchange',render);
(async function(){shell();$('content').innerHTML='<div class="loading">'+esc(t('loading'))+'</div>';try{await refreshBoot();await render();if(state.boot.job&&state.boot.job.status==='running')advanceBuild();}catch(error){$('content').innerHTML=notice(errorText(error),true)+btn('bootstrap-retry','retry');bind('bootstrap-retry',function(){location.reload();});}})();
}());
</script>
