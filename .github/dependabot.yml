# Weekly dependency update PRs. Minor and patch updates are grouped into one
# PR per ecosystem so they don't flood the PR list; major updates come one
# PR each, since those are the ones that need reading. Security updates
# (Dependabot alerts) are opened as soon as an advisory is published,
# regardless of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mcp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      mcp-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /compiler
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      compiler-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
