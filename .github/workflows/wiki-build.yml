# DISABLED: this workflow builds and deploys the old Docusaurus
# `wiki-app/` site to GitHub Pages, but that site was replaced by a live
# Express+TS backend/frontend (see the README's stack note and
# documentation/11-wiki-app-and-dashboards.md) -- `wiki-app/` is now just
# the compiler's generated docs/media output, with no package.json, so the
# `npm ci`/`npm run build` steps below fail immediately. More fundamentally,
# a static Pages deploy can't serve this app at all anymore: it needs a
# running Node backend, a Python subprocess for the compiler/chat/email
# engines, and a persistent data/ directory, none of which GitHub Pages
# provides. Automatic triggering is removed (workflow_dispatch only, so it
# stays runnable by hand for reference/debugging without failing on every
# push to main) until there's a real deployment target for the live app
# (e.g. a container host) to replace this with.
name: Wiki Build and Deploy

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: compiler/requirements.txt

      - name: Install Python dependencies
        run: pip install -r compiler/requirements.txt

      - name: Run compiler pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python compiler/main.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: wiki-app/package-lock.json

      - name: Install Node dependencies
        working-directory: wiki-app
        run: npm ci

      - name: Build Docusaurus site
        working-directory: wiki-app
        env:
          GITHUB_PAGES: "true"
          GITHUB_ORG: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wiki-app/build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
