name: Apps Script checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js for development checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Apps Script source, translations, and manifest
        working-directory: apps-script
        run: npm run check
      - name: Run simulated Drive and compiler tests
        working-directory: apps-script
        run: npm test
      - name: Build installation package
        working-directory: apps-script
        run: npm run package
