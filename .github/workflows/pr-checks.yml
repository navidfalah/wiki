name: Checks

# Every job runs the same ./wiki CLI a developer runs locally, so "green on
# my machine" and "green in CI" mean the same thing:
#   ./wiki ci --only <pkg>   lint, typecheck, coverage (with floors), build
#   ./wiki e2e               Playwright against the real backend + frontend
#   ./wiki docker            compose/Caddyfile validation + image build
# On CI a step whose prerequisite is missing fails instead of being skipped,
# and each job writes its results table to the run's summary page.

on:
  # Every push to every branch, so a broken commit is caught before a PR
  # exists (main went red once from commits that never passed through one).
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Node dependencies
        run: npm ci --prefix backend

      - name: ./wiki ci --only backend (eslint, typecheck, vitest + coverage floor, build)
        run: ./wiki ci --only backend

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci --prefix frontend

      - name: ./wiki ci --only frontend (eslint, typecheck + i18n, vitest + coverage floor, build)
        run: ./wiki ci --only frontend

  e2e:
    # Real backend + frontend in Chromium: every page loads without a script
    # error or CSP violation; search, history, backups and the dashboard work.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: ./wiki e2e (build frontend, Playwright smoke suite)
        run: ./wiki e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    # Guards the production images and compose file against silent breakage.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: ./wiki docker (compose config, Caddyfile, image build)
        run: ./wiki docker
