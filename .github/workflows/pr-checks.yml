name: PR Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: compiler/requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: python -m pytest -q

  wiki-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wiki-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: wiki-app/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Build Docusaurus site
        # Validates the currently-committed wiki-app/docs build cleanly.
        # Does not run the LLM-only compiler — that needs OPENAI_API_KEY,
        # which isn't available to PRs from forks. See wiki-build.yml for
        # the push-to-main workflow that recompiles docs and deploys.
        run: npm run build
