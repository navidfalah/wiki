name: Checks

# Every job runs the same ./wiki CLI a developer runs locally, so "green on
# my machine" and "green in CI" mean the same thing:
#   ./wiki ci --only <pkg>   lint, typecheck, coverage (with floors), eval gate, build
#   ./wiki e2e               Playwright against the real backend + frontend
#   ./wiki docker            compose/Caddyfile validation + image build
# On CI a step whose prerequisite is missing fails instead of being skipped,
# and each job writes its results table to the run's summary page.

on:
  # Every push to every branch, so a broken commit is caught before a PR
  # exists (main went red once from commits that never passed through one).
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# The actions below are the Node 24 majors (Node 20 actions are deprecated on
# GitHub-hosted runners). Every job has a timeout: a hung server or browser
# would otherwise hold the runner for GitHub's 6-hour default.
#
# One run per commit: a branch in this repository is already checked by its
# push run, whose checks show on the PR's head commit, so each job skips the
# duplicate pull_request run for it. PRs from forks (no push run here) still
# run on pull_request.

concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the Docker images run; 3.10 is the oldest interpreter
        # the compiler supports outside Docker (it broke there twice before).
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: compiler/requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r compiler/requirements-dev.txt

      - name: ./wiki ci --only compiler (ruff, pytest + coverage floor, eval gate)
        run: ./wiki ci --only compiler

  backend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Node dependencies
        run: npm ci --prefix backend

      - name: ./wiki ci --only backend (eslint, typecheck, vitest + coverage floor, build)
        run: ./wiki ci --only backend

  frontend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci --prefix frontend

      - name: ./wiki ci --only frontend (eslint, typecheck + i18n, vitest + coverage floor, build)
        run: ./wiki ci --only frontend

  e2e:
    # Real backend + frontend in Chromium: every page loads without a script
    # error or CSP violation; search, history, backups and the dashboard work.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Set up Python (the backend shells out to compiler/cli.py)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: compiler/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r compiler/requirements.txt
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: ./wiki e2e (build frontend, Playwright smoke suite)
        run: ./wiki e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    # Guards the production images and compose file against silent breakage.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: ./wiki docker (compose config, Caddyfile, image build)
        run: ./wiki docker
