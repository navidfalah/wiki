name: PR Checks

on:
  pull_request:
    branches:
      - main
  # Also on direct pushes: main went red once from commits that never
  # passed through a PR (a raw-data reorg that broke eval dataset paths).
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the Docker images run; 3.10 is the oldest interpreter
        # the compiler supports outside Docker (it broke there twice before).
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: compiler

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: compiler/requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: python -m pytest -q

      - name: Eval regression gate (offline evals vs. eval_baseline.json)
        run: python eval_gate.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck
        # Also covers the client bundle typecheck and the i18n key check --
        # see frontend/package.json's "typecheck" script.
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Build (fonts + Tailwind + client bundles + server)
        run: npm run build

  e2e:
    # Real backend + frontend in Chromium: every page must load without a
    # script error or CSP violation, search must work, raw previews nosniff.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Set up Python (the backend shells out to compiler/cli.py)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: compiler/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r compiler/requirements.txt
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Build frontend assets
        run: npm run build --prefix frontend

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Smoke test (Playwright)
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    # Guards the production images and compose file against silent breakage.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate production compose file
        env:
          ADMIN_PASSWORD: ci-placeholder
        run: docker compose -f docker-compose.prod.yml config -q

      - name: Validate production compose file with the --caddy profile
        env:
          ADMIN_PASSWORD: ci-placeholder
        run: docker compose -f docker-compose.prod.yml --profile caddy config -q

      - name: Validate Caddyfile
        run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Build images
        env:
          ADMIN_PASSWORD: ci-placeholder
        run: docker compose -f docker-compose.prod.yml build
