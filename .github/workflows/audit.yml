name: Dependency audit

# Known-vulnerability scan of the production dependencies: npm audit
# (--omit=dev) for backend and frontend, pip-audit for the compiler.
# Deliberately NOT part of the Checks workflow: a new advisory would turn an
# unrelated commit red. Instead this runs weekly (and on demand, and when a
# lockfile changes), so a red run here means "something to upgrade", and
# Dependabot (.github/dependabot.yml) usually has the PR ready.

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/package-lock.json
      - frontend/package-lock.json
      - mcp/package-lock.json
      - compiler/requirements.txt

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: ./wiki audit (npm audit --omit=dev, pip-audit)
        run: ./wiki audit
