name: llm-wiki

services:
  # Express + TypeScript API server. Owns everything that's a plain
  # filesystem/JSON read or write (sources registry, raw-file explorer,
  # docs, analytics, dead-link audit, knowledge graph, resources) as a
  # genuine TypeScript port -- see backend/src/lib/. Retrieval/LLM chat
  # (rag_engine.py) and .eml parsing + trust resolution (email_engine.py)
  # stay Python, reached via a subprocess into compiler/cli.py rather than
  # reimplemented; the compiler pipeline itself (`main.py`) also stays
  # Python, run the same way build_runner.py used to, just spawned from
  # Node instead of FastAPI. See documentation/11-wiki-app-and-dashboards.md.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: llm-wiki-backend
    env_file:
      - path: .env
        required: false
    environment:
      # Defaults point at OpenAI; override in .env (or here) to use Gemini,
      # the self-contained local-llm container below (Gemma running
      # in-process via llama.cpp — no Ollama), or any other
      # OpenAI-compatible endpoint. See documentation/33-docker-and-local-llm.md.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      # Bootstrap admin account, created once on first boot (no-op if
      # data/users.json already has a user) -- see backend/src/lib/users.ts.
      # Defaults to a known login (shown on the sign-in page itself) so a
      # fresh install can always get in without digging through
      # `docker compose logs backend` for a generated password -- override
      # both for anything beyond local/sample use.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-aurora_admin}
    volumes:
      # Mutable data shared with the host and (for docs/media) the
      # frontend service — not baked into the image, so a compile's output
      # survives a rebuild and is visible outside the container.
      - ./data:/app/data
      - ./wiki-app/docs:/app/wiki-app/docs
      - ./wiki-app/static/media:/app/wiki-app/static/media
      - ./compiler/temp_output:/app/compiler/temp_output
      # Live code mount for the Python side only — main.py/cli.py edits on
      # the host apply without a rebuild. The Node side isn't live-mounted
      # (unlike the old compiler-api's uvicorn reload=True); rebuild the
      # image to pick up backend/ changes.
      - ./compiler:/app/compiler
    ports:
      # Host-side port is overridable (BACKEND_PORT=8001 docker compose up)
      # for when something else on the host is already using 8000 --
      # the container itself always listens on 8000 internally.
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: llm-wiki-frontend
    environment:
      # BACKEND_API_URL is this container's own server-side fetches (SSR
      # wiki-page/dashboard rendering) — must be the Docker service
      # hostname, not localhost, since it's reached over the Compose
      # network, not the host's. PUBLIC_API_URL is embedded into every
      # rendered page for the browser's own fetch/EventSource/<img>/<embed>
      # calls — left empty (relative) so those go through this container's
      # own /api proxy, which is what attaches the session cookie's token
      # as the Authorization header the backend requires post-login.
      # See frontend/src/config.ts for the full explanation.
      BACKEND_API_URL: http://backend:8000
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
    ports:
      # Same override pattern as backend's BACKEND_PORT above -- if your
      # host already has something on 3000 (a different project's dev
      # server, say), run e.g. `FRONTEND_PORT=3001 docker compose up`
      # instead of fighting over the port.
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # Optional local LLM — Gemma served in-process by llama.cpp, running
  # *inside this container*, not via a separate Ollama daemon/image. Not
  # started by a plain `docker compose up`; run
  # `docker compose --profile local-llm up` to include it. See
  # documentation/33-docker-and-local-llm.md for the full switch-over, and
  # docker/local-llm/ for the Dockerfile + entrypoint.
  # Sample PostgreSQL database for the "Connect your own database" feature
  # (/database page, compiler/connectors/postgres_db.py). Represents a
  # user's own external Postgres instance -- seeded with a small fictional
  # Aurora Labs knowledge base (departments/employees/projects/kb_articles)
  # via docker/postgres/init.sql so the whole connect -> browse -> import
  # -> compile flow can be tried with zero setup. Not required for the
  # feature itself: the /database page connects to ANY reachable Postgres
  # server, this is just a ready-made one. See
  # documentation/39-postgres-database-connector.md.
  postgres:
    image: postgres:16-alpine
    container_name: llm-wiki-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aurora_kb}
      POSTGRES_USER: ${POSTGRES_USER:-wiki_reader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurora_sample_pw}
    volumes:
      # Seed script only runs against an empty data directory -- see the
      # comment at the top of init.sql for what that means when editing it.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Exposed on the host so /database's connect form can also be used
      # with host=localhost from outside Docker (e.g. testing the connector
      # against this container without going through the frontend proxy).
      # Same override pattern as BACKEND_PORT/FRONTEND_PORT above.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wiki_reader} -d ${POSTGRES_DB:-aurora_kb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  local-llm:
    build:
      context: .
      dockerfile: docker/local-llm/Dockerfile
    container_name: llm-wiki-local-llm
    profiles: ["local-llm"]
    environment:
      # MODEL_REPO/MODEL_FILE must name an actual GGUF file on Hugging
      # Face. Defaults to bartowski/gemma-2-2b-it-GGUF's Q5_K_M quant
      # (~1.9GB, real repo — verified against the Hugging Face listing).
      # Override in .env to swap in a different Gemma-family GGUF build.
      MODEL_REPO: ${LOCAL_LLM_MODEL_REPO:-bartowski/gemma-2-2b-it-GGUF}
      MODEL_FILE: ${LOCAL_LLM_MODEL_FILE:-gemma-2-2b-it-Q5_K_M.gguf}
      MODEL_ALIAS: ${LOCAL_LLM_MODEL_ALIAS:-gemma-2-2b-it}
      HF_TOKEN: ${HF_TOKEN:-}
      LOCAL_LLM_CONTEXT: ${LOCAL_LLM_CONTEXT:-4096}
      LOCAL_LLM_CHAT_FORMAT: ${LOCAL_LLM_CHAT_FORMAT:-gemma}
    volumes:
      # Named volume so the (multi-GB) model download survives container
      # restarts and image rebuilds — only re-downloaded if MODEL_FILE
      # changes to something not already present.
      - local-llm-models:/models
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  local-llm-models:
  postgres-data:
