name: llm-wiki

services:
  # Express + TypeScript API server. Owns everything that's a plain
  # filesystem/JSON read or write (sources registry, raw-file explorer,
  # docs, analytics, dead-link audit, knowledge graph, resources) as a
  # genuine TypeScript port -- see backend/src/lib/. Retrieval/LLM chat
  # (rag_engine.py) and .eml parsing + trust resolution (email_engine.py)
  # stay Python, reached via a subprocess into compiler/cli.py rather than
  # reimplemented; the compiler pipeline itself (`main.py`) also stays
  # Python, run the same way build_runner.py used to, just spawned from
  # Node instead of FastAPI. See documentation/11-wiki-app-and-dashboards.md.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: llm-wiki-backend
    env_file:
      - path: .env
        required: false
    environment:
      # Defaults point at OpenAI; override in .env (or here) to use Gemini,
      # the self-contained local-llm container below (Gemma running
      # in-process via llama.cpp — no Ollama), or any other
      # OpenAI-compatible endpoint. See documentation/33-docker-and-local-llm.md.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      # Bootstrap admin account, created once on first boot (no-op if
      # data/users.json already has a user) -- see backend/src/lib/users.ts.
      # Leave ADMIN_PASSWORD unset to get a random one printed to
      # `docker compose logs backend` instead.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      # Mutable data shared with the host and (for docs/media) the
      # frontend service — not baked into the image, so a compile's output
      # survives a rebuild and is visible outside the container.
      - ./data:/app/data
      - ./wiki-app/docs:/app/wiki-app/docs
      - ./wiki-app/static/media:/app/wiki-app/static/media
      - ./compiler/temp_output:/app/compiler/temp_output
      # Live code mount for the Python side only — main.py/cli.py edits on
      # the host apply without a rebuild. The Node side isn't live-mounted
      # (unlike the old compiler-api's uvicorn reload=True); rebuild the
      # image to pick up backend/ changes.
      - ./compiler:/app/compiler
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: llm-wiki-frontend
    environment:
      # BACKEND_API_URL is this container's own server-side fetches (SSR
      # wiki-page/dashboard rendering) — must be the Docker service
      # hostname, not localhost, since it's reached over the Compose
      # network, not the host's. PUBLIC_API_URL is embedded into every
      # rendered page for the browser's own fetch/EventSource/<img>/<embed>
      # calls — left empty (relative) so those go through this container's
      # own /api proxy, which is what attaches the session cookie's token
      # as the Authorization header the backend requires post-login.
      # See frontend/src/config.ts for the full explanation.
      BACKEND_API_URL: http://backend:8000
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # Optional local LLM — Gemma served in-process by llama.cpp, running
  # *inside this container*, not via a separate Ollama daemon/image. Not
  # started by a plain `docker compose up`; run
  # `docker compose --profile local-llm up` to include it. See
  # documentation/33-docker-and-local-llm.md for the full switch-over, and
  # docker/local-llm/ for the Dockerfile + entrypoint.
  local-llm:
    build:
      context: .
      dockerfile: docker/local-llm/Dockerfile
    container_name: llm-wiki-local-llm
    profiles: ["local-llm"]
    environment:
      # MODEL_REPO/MODEL_FILE must name an actual GGUF file on Hugging
      # Face — the defaults below are a placeholder naming pattern, not a
      # verified repo (see documentation/33-docker-and-local-llm.md's
      # honesty note on this). Override in .env once you've confirmed the
      # real repo/filename for the Gemma build you want.
      MODEL_REPO: ${LOCAL_LLM_MODEL_REPO:-google/gemma-4-it-GGUF}
      MODEL_FILE: ${LOCAL_LLM_MODEL_FILE:-gemma-4-it-Q4_K_M.gguf}
      MODEL_ALIAS: ${LOCAL_LLM_MODEL_ALIAS:-gemma-4}
      HF_TOKEN: ${HF_TOKEN:-}
      LOCAL_LLM_CONTEXT: ${LOCAL_LLM_CONTEXT:-4096}
      LOCAL_LLM_CHAT_FORMAT: ${LOCAL_LLM_CHAT_FORMAT:-gemma}
    volumes:
      # Named volume so the (multi-GB) model download survives container
      # restarts and image rebuilds — only re-downloaded if MODEL_FILE
      # changes to something not already present.
      - local-llm-models:/models
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  local-llm-models:
